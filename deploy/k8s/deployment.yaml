apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agents
  labels:
    app.kubernetes.io/name: ai-agents
spec:
  # One copy, and Recreate (not rolling): the running agent and its log live in memory,
  # and two copies would both work the same ticket queue.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-agents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-agents
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: ai-agents
          # The tag is set in kustomization.yaml (images:)
          image: timothypaulschmidt/ai-agents
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Same namespace as the Assistant, so Service names resolve.
            - name: OLLAMA_BASE_URL
              value: http://ollama:11434
            - name: OLLAMA_MODEL
              value: qwen3:8b
            - name: MCP_SERVER_URL
              value: http://mcp-server:8000/mcp
            # FortiAIGate (the "Traffic" switch on the page). Same values as the Assistant's overlays.
            # The gateway is HTTPS with a self-signed certificate for now, hence FAIG_VERIFY_TLS=false;
            # set it to true once a trusted certificate is installed.
            - name: FAIG_OLLAMA_BASE_URL
              value: https://llm-gateway.fortiaigate:8080/ai/openai
            - name: FAIG_GEMINI_BASE_URL
              value: https://llm-gateway.fortiaigate:8080/ai/openai/v1
            # plain name (page, Direct) = FortiAIGate's name for the model (provider slug + model)
            - name: FAIG_MODEL_MAP
              value: "qwen3:8b=ollama-qwen3-8b,qwen3:4b=ollama-qwen3-4b,llama3.2:3b=ollama-llama3.2-3b,gemini-3.6-flash=google-gemini-3.6-flash,gemini-3.5-flash-lite=google-gemini-3.5-flash-lite,gemini-3.5-flash=google-gemini-3.5-flash,gemini-robotics-er-2-preview=google-gemini-robotics-er-2-preview"
            - name: FAIG_VERIFY_TLS
              value: "false"
            # The MCP route (FAIG_MCP_SERVER_URL) is added in a later step.
            # Until the key below exists the Traffic route stays Direct.
            - name: FAIG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: faig-api-key
                  key: FAIG_API_KEY
                  optional: true
            # Idle wait between queue checks: the "slow loop" that keeps the CPU free.
            - name: POLL_SECONDS
              value: "60"
            - name: MAX_STEPS
              value: "8"
            # Operator token for the MCP server's /admin routes (the same Secret the MCP
            # server reads). Without it the page works but reset/insert are off.
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-admin
                  key: token
                  optional: true
            # Optional: lets you pick Gemini as the model source. Reuses the Assistant's Secret.
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key
                  key: GEMINI_API_KEY
                  optional: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
